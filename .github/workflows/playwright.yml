name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 14 * * *'  # Daily at 2:00 PM UTC (9:00 AM EST)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      run: |
        npx playwright test || true

    - name: Upload HTML Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Upload JUnit results to Xray (Jira Cloud)
      if: ${{ !cancelled() }}
      run: |
        # Authenticate with Xray and get token
        TOKEN=$(curl -s -X POST \
          "https://xray.cloud.getxray.app/api/v2/authenticate" \
          -H "Content-Type: application/json" \
          -d "{\"client_id\": \"${{ secrets.XRAY_CLIENT_ID }}\", \"client_secret\": \"${{ secrets.XRAY_CLIENT_SECRET }}\"}" \
          | tr -d '"')

        # Upload JUnit XML results to Xray
        curl -s -X POST \
          "https://xray.cloud.getxray.app/api/v2/import/execution/junit" \
          -H "Authorization: Bearer ${TOKEN}" \
          -H "Content-Type: text/xml" \
          --data-binary @results/junit-results.xml

